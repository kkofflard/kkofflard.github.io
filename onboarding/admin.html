<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nieuwe Medewerker Aanmaken</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h1>Nieuwe Medewerker</h1>
        <p>Maak een nieuw account aan in Microsoft Entra</p>
      </div>

      <form id="createUserForm">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">Voornaam *</label>
            <input type="text" id="firstName" required placeholder="Jan">
          </div>
          <div class="form-group">
            <label for="lastName">Achternaam *</label>
            <input type="text" id="lastName" required placeholder="de Vries">
          </div>
        </div>

        <div class="form-group">
          <label for="displayName">Weergavenaam *</label>
          <input type="text" id="displayName" required placeholder="Jan de Vries">
        </div>

        <div class="form-group">
          <label for="privateEmail">Privé e-mailadres *</label>
          <input type="email" id="privateEmail" required placeholder="jan@gmail.com">
          <small>De verificatiemail wordt naar dit adres verstuurd</small>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="birthDate">Geboortedatum *</label>
            <input type="date" id="birthDate" required>
          </div>
          <div class="form-group">
            <label for="mobilePhone">Mobiel nummer (06) *</label>
            <input type="tel" id="mobilePhone" required placeholder="06 12345678" pattern="^(06|\+316|00316)\s?\d{8}$">
            <small>Nederlands mobiel nummer</small>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="department">Afdeling</label>
            <input type="text" id="department" placeholder="ICT">
          </div>
          <div class="form-group">
            <label for="jobTitle">Functie</label>
            <input type="text" id="jobTitle" placeholder="Software Developer">
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">
          <span class="btn-text">Medewerker Aanmaken</span>
          <span class="btn-loading" style="display:none;">Bezig met aanmaken...</span>
        </button>
      </form>

      <div id="result" class="result" style="display:none;"></div>
    </div>
  </div>

  <script>
    const API_BASE = window.APP_CONFIG?.API_BASE || '/api';

    // Auto-fill display name
    const firstName = document.getElementById('firstName');
    const lastName = document.getElementById('lastName');
    const displayName = document.getElementById('displayName');

    function updateDisplayName() {
      if (!displayName.dataset.manual) {
        displayName.value = [firstName.value, lastName.value].filter(Boolean).join(' ');
      }
    }
    firstName.addEventListener('input', updateDisplayName);
    lastName.addEventListener('input', updateDisplayName);
    displayName.addEventListener('input', () => { displayName.dataset.manual = 'true'; });

    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      const btnText = btn.querySelector('.btn-text');
      const btnLoading = btn.querySelector('.btn-loading');
      const resultDiv = document.getElementById('result');

      btn.disabled = true;
      btnText.style.display = 'none';
      btnLoading.style.display = 'inline';

      try {
        const response = await fetch(`${API_BASE}/users/create`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firstName: firstName.value,
            lastName: lastName.value,
            displayName: displayName.value,
            privateEmail: document.getElementById('privateEmail').value,
            birthDate: document.getElementById('birthDate').value,
            mobilePhone: document.getElementById('mobilePhone').value,
            department: document.getElementById('department').value || undefined,
            jobTitle: document.getElementById('jobTitle').value || undefined,
          }),
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.className = 'result success';
          resultDiv.innerHTML = `
            <h3>Gebruiker aangemaakt</h3>
            <p><strong>Gebruikersnaam:</strong> ${data.userPrincipalName}</p>
            <p>${data.message}</p>
          `;
          e.target.reset();
        } else {
          resultDiv.className = 'result error';
          resultDiv.innerHTML = `
            <h3>Fout</h3>
            <p>${data.error}</p>
            ${data.details ? `<p class="details">${data.details}</p>` : ''}
          `;
        }
      } catch (err) {
        resultDiv.className = 'result error';
        resultDiv.innerHTML = `
          <h3>Verbindingsfout</h3>
          <p>Kan geen verbinding maken met de server. Probeer het opnieuw.</p>
        `;
      }

      resultDiv.style.display = 'block';
      btn.disabled = false;
      btnText.style.display = 'inline';
      btnLoading.style.display = 'none';
    });
  </script>
</body>
</html>
